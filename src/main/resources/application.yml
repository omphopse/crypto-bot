spring:
  application:
    name: algopilot-api
  datasource:
    url: ${ALGOPILOT_DATABASE_URL:jdbc:postgresql://localhost:5432/algopilot}
    username: ${ALGOPILOT_DATABASE_USER:algopilot}
    password: ${ALGOPILOT_DATABASE_PASSWORD:algopilot_dev_only}
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

server:
  error:
    include-message: never

algopilot:
  ai:
    provider: ${AI_PROVIDER:gemini}
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
    xai:
      base-url: ${XAI_BASE_URL:https://api.x.ai/v1}
      api-key: ${XAI_API_KEY:}
      model: ${XAI_MODEL:grok-2-latest}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_MODEL:gemma3:4b}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:45}
  alpaca:
    base-url: ${ALPACA_BASE_URL:https://paper-api.alpaca.markets/v2}
    key-id: ${ALPACA_API_KEY:}
    secret-key: ${ALPACA_API_SECRET:}
  bybit:
    base-url: ${BYBIT_BASE_URL:https://api-demo.bybit.com}
    api-key: ${BYBIT_API_KEY:}
    api-secret: ${BYBIT_API_SECRET:}
    recv-window: "5000"

spring:
  application:
    name: algopilot-api
  datasource:
    url: ${ALGOPILOT_DATABASE_URL:jdbc:postgresql://localhost:5432/algopilot}
    username: ${ALGOPILOT_DATABASE_USER:algopilot}
    password: ${ALGOPILOT_DATABASE_PASSWORD:algopilot_dev_only}
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  error:
    include-message: never

algopilot:
  alpaca:
    base-url: ${ALPACA_BASE_URL:https://paper-api.alpaca.markets/v2}
    key-id: ${ALPACA_API_KEY:}
    secret-key: ${ALPACA_API_SECRET:}
  bybit:
    base-url: ${BYBIT_BASE_URL:https://api-demo.bybit.com}
    api-key: ${BYBIT_API_KEY:}
    api-secret: ${BYBIT_API_SECRET:}
    recv-window: "5000"
